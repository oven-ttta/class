<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>สมุดตารางเรียน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: registrar-style timetable sheet; person tabs on top, editable profile, day×hour grid, exam table below */
:root{
  --bg:#eef0f5; --surface:#ffffff; --ink:#1d2230; --muted:#5b6274; --line:#d6dae4; --cell:#ebecf0;
  --head:#45484f; --head-ink:#ffffff; --day:#9b9ea6; --weekend:#a8433f; --accent:#2c5bcc; --teal:#2a7a70;
  --b-blue:#c3cbf7; --b-rose:#f0a3a3; --b-green:#bfe2c8; --b-amber:#f4d898; --b-violet:#dcc7f2; --b-ink:#1b2133;
  --b-teal:#b5e0dc; --b-peach:#f6c6a8; --b-sky:#b9def5; --b-slate:#d3d6de; --busy:#d4d7df; --ok:#3f8f5a; --ok-bg:#e3f3e8; --bad-bg:#fbe5e3;
  --danger:#b3261e; --shadow:0 1px 2px rgba(20,30,60,.08),0 6px 20px rgba(20,30,60,.06);
  --f-display:"Sarabun","TH Sarabun New","TH SarabunPSK",system-ui,sans-serif; --f-body:"Sarabun","TH Sarabun New","TH SarabunPSK",system-ui,sans-serif; --f-mono:"Sarabun","TH Sarabun New","TH SarabunPSK",system-ui,sans-serif;
  --daycol:86px; --slot:34px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151b; --surface:#1b1e26; --ink:#e7e9f0; --muted:#a2a8b8; --line:#30343f; --cell:#21242d;
  --head:#0d0f14; --head-ink:#e7e9f0; --day:#3b3f49; --weekend:#86403c; --accent:#93b2ff; --teal:#1f5d55;
  --b-blue:#36427c; --b-rose:#7b3b40; --b-green:#2f5d3e; --b-amber:#6d5626; --b-violet:#54417b; --b-ink:#eef0fa;
  --b-teal:#255a56; --b-peach:#734a33; --b-sky:#2b5470; --b-slate:#3d424e; --busy:#2c303b; --ok:#5fbf7d; --ok-bg:#1d3326; --bad-bg:#3a1f1f;
  --danger:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#13151b; --surface:#1b1e26; --ink:#e7e9f0; --muted:#a2a8b8; --line:#30343f; --cell:#21242d;
  --head:#0d0f14; --head-ink:#e7e9f0; --day:#3b3f49; --weekend:#86403c; --accent:#93b2ff; --teal:#1f5d55;
  --b-blue:#36427c; --b-rose:#7b3b40; --b-green:#2f5d3e; --b-amber:#6d5626; --b-violet:#54417b; --b-ink:#eef0fa;
  --b-teal:#255a56; --b-peach:#734a33; --b-sky:#2b5470; --b-slate:#3d424e; --busy:#2c303b; --ok:#5fbf7d; --ok-bg:#1d3326; --bad-bg:#3a1f1f;
  --danger:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.5rem;font-weight:700}
.top p{margin:0;color:var(--muted);font-size:.9rem}

.people{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.sheet{padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet-title{font-family:var(--f-display);color:var(--accent);font-size:1.15rem;font-weight:700}
.profile{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.profile label{color:var(--muted);font-size:.85rem}
.field{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 8px;width:100%;min-width:0}
.field:hover{border-color:var(--line)}
.field:focus{border-color:var(--accent);background:var(--bg);outline:none}
.field.name{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.hint{font-size:.78rem;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar .grp{display:flex;align-items:center;gap:6px}
.bar .lbl{color:var(--weekend);font-family:var(--f-display);font-weight:600}
.small{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 8px}
.year{width:5.5em;font-variant-numeric:tabular-nums}
.term{width:3.5em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.spacer{flex:1}

.scroll{overflow-x:auto;border-radius:6px}
.grid{display:grid;gap:2px;background:var(--surface);min-width:640px;font-variant-numeric:tabular-nums}
.gh{background:var(--head);color:var(--head-ink);font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 2px;line-height:1.2}
.gd{background:var(--day);color:var(--head-ink);font-family:var(--f-display);font-weight:600;display:flex;align-items:center;justify-content:center;font-size:.9rem;padding:4px}
.gd.weekend{background:var(--weekend)}
.ge{background:var(--cell);min-height:56px;border:0;padding:0}
.ge:hover{background:color-mix(in srgb,var(--accent) 14%,var(--cell))}
.gc{border:0;text-align:center;padding:4px 6px;color:var(--b-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.3;font-size:.74rem;min-height:56px;z-index:1;min-width:0;overflow:hidden}
.gc:hover{filter:brightness(.96)}
.gc .code{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);font-size:.72rem}
.gc.big{font-size:.95rem}
.gc.big .code{font-size:.95rem;font-weight:700}
.gc[data-c="blue"]{background:var(--b-blue)} .gc[data-c="rose"]{background:var(--b-rose)}
.gc[data-c="green"]{background:var(--b-green)} .gc[data-c="amber"]{background:var(--b-amber)}
.gc[data-c="violet"]{background:var(--b-violet)}
.gc .cn{opacity:.8;font-size:.92em}
.note{font-size:.82rem;color:var(--muted)}
.warn{font-size:.85rem;color:var(--weekend)}

.exam-h{background:var(--teal);color:#fff;text-align:center;padding:8px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;border-radius:6px 6px 0 0}
table{border-collapse:collapse;width:100%;min-width:620px}
th{color:var(--accent);font-family:var(--f-display);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.88rem}
tr.er{cursor:pointer} tr.er:hover td{background:var(--cell)}
td.code{font-family:var(--f-mono);white-space:nowrap;font-size:.82rem}
td.when{white-space:pre-line;font-size:.78rem;color:var(--muted);text-align:center}
td .th{color:var(--muted)}
.legend{font-size:.82rem;color:var(--muted)}

.tools{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tools h3{font-size:1rem}
textarea.data{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;font-family:var(--f-mono);font-size:.75rem}

.ov{position:fixed;inset:0;background:rgba(10,14,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:1.15rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;color:var(--ink);font-size:.95rem;width:100%}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{display:block;width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.sw input:checked+span{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.daylist{display:flex;flex-direction:column;gap:6px}
.dayrow{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.dayrow span{flex:1;font-weight:500}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;line-height:1}
.views{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:max-content;max-width:100%;flex-wrap:wrap}
.views button{border:0;background:transparent;border-radius:7px;padding:7px 16px;font-family:var(--f-display);font-weight:600;color:var(--muted)}
.views button[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.gc[data-c="teal"]{background:var(--b-teal)} .gc[data-c="peach"]{background:var(--b-peach)} .gc[data-c="sky"]{background:var(--b-sky)}
.gc[data-c="slate"]{background:var(--b-slate)}
.gc.clash{box-shadow:inset 0 0 0 3px var(--danger)}
.gc .who{font-weight:600}
.gc.busy{background:repeating-linear-gradient(135deg,var(--cell) 0 6px,var(--busy) 6px 12px);color:var(--muted);cursor:default;border:1px dashed var(--muted)}
.gc.busy:hover{filter:none}
.status{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:8px;border:1px solid var(--line)}
.status.ok{background:var(--ok-bg);border-color:var(--ok)}
.status.bad{background:var(--bad-bg);border-color:var(--danger)}
.status b{font-family:var(--f-display)}
.status ul{margin:0;padding-left:20px;font-size:.88rem}
.status li{cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.78rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);white-space:nowrap}
.pill.done{background:var(--ok-bg);border-color:var(--ok)}
.pill.over{background:var(--bad-bg);border-color:var(--danger)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tin{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;width:100%;min-width:0}
.tin:hover{border-color:var(--line)} .tin:focus{border-color:var(--accent);background:var(--bg);outline:none}
.tin.num{width:4.2em;font-variant-numeric:tabular-nums}
.tin.cd{width:6.5em;font-family:var(--f-mono);font-size:.82rem}
td.mid{vertical-align:middle}
tr.grp td{background:var(--cell);font-family:var(--f-display);font-weight:600;text-align:center;color:var(--ink)}
.mclash{font-size:.85rem;color:var(--danger);background:var(--bad-bg);border-radius:6px;padding:8px 10px}
.mclash.ok{color:var(--ink);background:var(--ok-bg)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="live"]{color:var(--ok);border-color:var(--ok)} .sync[data-s="live"]::before{background:var(--ok)}
.sync[data-s="error"]{color:var(--danger);border-color:var(--danger)} .sync[data-s="error"]::before{background:var(--danger)}
.sync[data-s="connecting"]::before{background:var(--b-amber)}

/* ---- app shell ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1280px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.appbar h1{font-size:1.3rem;font-weight:700;margin-right:auto}
.wrap{max-width:1280px}
.study{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.teach{display:flex;flex-direction:column;gap:18px;min-width:0}
.side{position:sticky;top:76px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.side-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.side-h h2{font-size:1rem}
.side input.q[type="search"],.side select.q{flex:none;width:100%}
td.wide>span{display:block}
.plist{display:flex;flex-direction:column;gap:4px;max-height:58vh;overflow:auto;margin:0 -4px;padding:0 4px}
.pitem{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;gap:1px}
.pitem:hover{background:var(--cell)}
.pitem[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pitem .pn{font-weight:600;line-height:1.3}
.pitem .ps{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sheet-head>div{flex:1 1 260px;min-width:0}
.eyebrow{font-size:.78rem;color:var(--accent);font-family:var(--f-display);font-weight:600;letter-spacing:.02em}
.stats{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:8px}
details.prof{border:1px solid var(--line);border-radius:8px;padding:0 12px}
details.prof[open]{padding-bottom:12px}
details summary{cursor:pointer;padding:9px 0;font-weight:600;font-family:var(--f-display);font-size:.92rem;color:var(--muted)}
details.prof .profile{margin-bottom:10px}
/* ---- filters ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.q,select.q{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 10px;min-height:36px;max-width:100%}
input.q[type="search"]{flex:1 1 200px;min-width:0}
.qlabel{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.qcheck{display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 12px;min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font-size:.82rem;color:var(--muted)}
.gc.dim{opacity:.18}
.next{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--teal) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--teal) 40%,var(--line));font-size:.9rem}
.next b{font-family:var(--f-display)}
/* ---- agenda (list mode) ---- */
.agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.aday{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);min-width:0}
.aday-h{font-size:.95rem;background:var(--day);color:var(--head-ink);padding:7px 12px;display:flex;justify-content:space-between;align-items:center}
.aday-h.weekend{background:var(--weekend)}
.aday-h span{font-size:.78rem;font-family:var(--f-body);font-weight:500;opacity:.9}
.ai{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:10px;text-align:left;border:0;border-left:5px solid var(--sw);background:color-mix(in srgb,var(--sw) 38%,var(--surface));margin:8px 8px 0;border-radius:6px;padding:8px 10px;color:var(--ink);font-size:.86rem;line-height:1.35}
.ai:hover{filter:brightness(.97)}
.ai .at{font-variant-numeric:tabular-nums;font-weight:600;font-size:.8rem;color:var(--muted)}
.ai .ab{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.ai .code{font-family:var(--f-mono);color:var(--accent);font-size:.8rem}
.ai.clash{box-shadow:inset 0 0 0 2px var(--danger)}
.ai.busy{background:repeating-linear-gradient(135deg,var(--cell) 0 6px,var(--busy) 6px 12px);border-left-color:var(--muted);color:var(--muted);cursor:default}
.aempty{padding:10px 12px 0}
.addday{margin:8px;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:7px;color:var(--muted);font-size:.85rem}
.addday:hover{border-color:var(--accent);color:var(--accent)}
details.tools summary{padding:0}
/* ---- tables become cards on phones ---- */
@media (max-width:900px){
  .study{grid-template-columns:1fr}
  .side{position:static}
  .plist{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}
  .pitem{flex:none;min-width:150px;max-width:220px;border-color:var(--line)}
}
@media (max-width:640px){
  .sheet{padding:14px}
  .appbar h1{font-size:1.1rem}
  .views{order:3;width:100%;max-width:none}
  .views button{flex:1;padding:7px 8px}
  table.cards{min-width:0}
  table.cards thead{display:none}
  table.cards tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  table.cards tr.grp,table.cards tr.sum{display:block;padding:0}
  table.cards tr.grp td,table.cards tr.sum td{display:block;width:100%}
  table.cards td{border:0;padding:2px 4px;display:flex;flex-direction:column;gap:1px;min-width:0}
  table.cards td[data-label]::before{content:attr(data-label);font-size:.72rem;color:var(--muted);font-family:var(--f-body)}
  table.cards td.wide{grid-column:1/-1}
  table.cards td.when{text-align:left}
  table.cards td.act{position:absolute;right:4px;top:8px}
  table.cards tr{position:relative}
  .tin.num,.tin.cd{width:100%}
  #tSubjects table.cards tr{grid-template-columns:repeat(3,minmax(0,1fr));padding-right:40px}
  table.cards td.span2,#tSubjects table.cards td.wide{grid-column:span 2}
}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:96px;height:96px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--cell)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .ib{position:absolute;top:4px;right:4px;width:26px;height:26px}
.loading{display:flex;align-items:center;gap:12px;padding:12px 0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.upv{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;font-size:.88rem}
.upr{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.upr .at{font-variant-numeric:tabular-nums;color:var(--muted)}
.upv .code{font-weight:600;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pname{font-size:1.4rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const pad=n=>String(n).padStart(2,'0');

function E(code,nameEn,nameTh,group,mid,fin){return {id:uid(),code,nameEn,nameTh,group,mid:mid||'-',final:fin||'-'}}

];

    C('อังคาร','13:00','17:00','DGT01 2420','1','DIGITAL TECH LAB 14',RA,'blue'),
    C('อังคาร','13:00','17:00','DGT01 2410','1','DIGITAL TECH LAB 14',RB,'rose'),
    C('พุธ','13:00','17:00','DGT01 2120','2','DIGITAL TECH LAB 11',RA,'blue'),
    C('พุธ','13:00','17:00','DGT01 2110','2','DIGITAL TECH LAB 11',RB,'rose'),

  ],exams:[

    E('DGT01 2410-1','FRONT-END APPLICATION DEVELOPMENT WITH .NET FRAMEWORK','การพัฒนาโปรแกรมประยุกต์ในส่วนติดต่อผู้ใช้ด้วยดอทเน็ตเฟรมเวิร์ค','1'),
    E('DGT01 2420-1','BACK-END APPLICATION DEVELOPMENT WITH .NET FRAMEWORK','การพัฒนาโปรแกรมประยุกต์ในส่วนการจัดการระบบด้วยดอทเน็ตเฟรมเวิร์ค','1','-','(C) 22 ม.ค. 2570\nเวลา 09:00-12:00'),
    E('DGT01 2430-1','PROJECT IN FULL STACK APPLICATION DEVELOPMENT WITH .NET FRAMEWORK','โครงงานการพัฒนาโปรแกรมประยุกต์เต็มรูปแบบของดอทเน็ตเฟรมเวิร์ค','1'),
    E('IST30 1105-1','ENGLISH FOR CAREERS','ภาษาอังกฤษเพื่อการทำงาน','16','-','(C) 20 ม.ค. 2570\nเวลา 16:30-19:30'),
  ]});
  const b=person('อัจฉรียา พุทธโคตร',{advisor:'ผู้ช่วยศาสตราจารย์ ดร.ฉัตรภัสร์ ฐิติอัครวงศ์',classes:[
    C('จันทร์','09:00','12:00','DGT01 0210','1','B6501-A',R1),
    C('จันทร์','13:00','15:00','DGT01 0310','2','B6502-A',R1),
    C('อังคาร','10:00','12:00','DGT01 0310','2','DIGITAL TECH LAB 11',R1),
    C('พุธ','09:00','12:00','DGT01 0330','2','DIGITAL TECH LAB 13',R1),
    C('พุธ','13:00','15:00','DGT01 0320','3','B2101',R1),
    C('พฤหัสบดี','09:00','12:00','IST30 1102','12','B6101-A',''),
    C('พฤหัสบดี','13:00','17:00','DGT01 0220','5','DIGITAL TECH LAB 14',R1),
    C('ศุกร์','13:00','15:00','DGT01 0320','3','DIGITAL TECH LAB 13',R1),
  ],exams:[...Y1EX(['1','5','2','3','2']),IST1102('12')]});
  const g1=()=>[
    C('จันทร์','09:00','12:00','DGT01 0210','1','B6501-A',R1),
    C('จันทร์','13:00','15:00','DGT01 0310','1','B6503-A',R1),
    C('อังคาร','10:00','12:00','DGT01 0310','1','DIGITAL TECH LAB 10',R1),
    C('พุธ','09:00','12:00','DGT01 0330','1','DIGITAL TECH LAB 11',R1),
    C('พุธ','13:00','15:00','DGT01 0320','1','B6503-A',R1),
    C('พฤหัสบดี','13:00','17:00','DGT01 0220','1','DIGITAL TECH LAB 10',R1),
    C('ศุกร์','13:00','15:00','DGT01 0320','1','DIGITAL TECH LAB 11',R1),
  ];

  const d=person('ตัวอย่าง: ปี 1 กลุ่ม 1 + อังกฤษ กลุ่ม 10',{classes:[...g1(),C('พฤหัสบดี','09:00','12:00','IST30 1102','10','B1141','')],exams:[...Y1EX(['1','1','1','1','1']),IST1102('10')]});

/* ---------- storage ---------- */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.people)&&s.people.length)return s}catch(e){}return null}
let state=load()||seed();
if(!state.teach)state.teach=seedTeach();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}schedulePush()}
const cur=()=>state.people.find(p=>p.id===state.currentId)||state.people[0];
function commit(){save();render()}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- render ---------- */
let view='study';
function setView(v){view=v==='teach'?'teach':'study';try{if(location.hash.slice(1)!==view)history.replaceState(null,'','#'+view)}catch(e){}render()}
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
function render(){
  document.getElementById('vStudy').hidden=view!=='study';document.getElementById('vTeach').hidden=view!=='teach';
  document.getElementById('tabStudy').setAttribute('aria-selected',view==='study');document.getElementById('tabTeach').setAttribute('aria-selected',view==='teach');
  const a=document.activeElement,aid=a&&a.id,sel=a&&a.type==='search'?[a.selectionStart,a.selectionEnd]:null;
  renderPeople();renderSheet();renderExams();renderTeach();
  if(aid){const n=document.getElementById(aid);if(n&&n!==a){n.focus({preventScroll:true});if(sel)try{n.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
/* ---------- per-viewer view settings (search, sort, filter, layout) ---------- */
const UIKEY=KEY+'-ui';
let ui={};try{ui=JSON.parse(localStorage.getItem(UIKEY))||{}}catch(e){}
ui=Object.assign({pq:'',psort:'order',cq:'',cdate:'',eq:'',esort:'code',tq:'',tteacher:'',sq:'',stype:'',spending:false,ssort:'order',teq:'',tesort:'order'},ui);
if(!ui.smode)ui.smode=innerWidth<700?'list':'grid';
if(!ui.tmode)ui.tmode=ui.smode;
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify(ui))}catch(e){}}
function setUI(k,v){ui[k]=v;saveUI();render()}
function bindUI(root){
  root.querySelectorAll('[data-ui]').forEach(i=>{const k=i.dataset.ui,ev=i.type==='search'?'input':'change';
    i.addEventListener(ev,()=>setUI(k,i.type==='checkbox'?i.checked:i.value))});
  root.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>setUI(b.dataset.seg,b.dataset.val));
}
const seg=(k,opts)=>`<div class="seg" role="group" aria-label="รูปแบบการแสดง">${opts.map(([v,l])=>`<button class="q" id="seg-${k}-${v}" data-seg="${k}" data-val="${v}" aria-pressed="${ui[k]===v}">${l}</button>`).join('')}</div>`;
const opt=(k,v,l)=>`<option value="${v}"${String(ui[k])===String(v)?' selected':''}>${l}</option>`;
const hasQ=(q,...f)=>{q=String(q||'').trim().toLowerCase();return !q||f.join(' ').toLowerCase().includes(q)};
const hrs=list=>list.reduce((a,c)=>a+Math.max(0,toMin(c.end)-toMin(c.start))/60,0);
const fmtH=h=>String(Math.round(h*10)/10);
const byStr=(a,b)=>String(a||'').localeCompare(String(b||''),'th');
function parseBE(s){const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;let y=+m[3];if(y>2400)y-=543;return new Date(y,+m[2]-1,+m[1])}
function inWeek(dates,iso){
  if(!iso||!dates)return true;const parts=String(dates).split('-');const a=parseBE(parts[0]),b=parseBE(parts[1]);
  const d=new Date(iso+'T00:00');if(isNaN(d))return true;
  const ws=new Date(d);ws.setDate(d.getDate()-((d.getDay()+6)%7));const we=new Date(ws);we.setDate(ws.getDate()+6);
  return (!a||a<=we)&&(!b||b>=ws);
}
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function examTime(s){const m=String(s||'').match(/(\d{1,2})\s*([ก-๙]+\.[ก-๙]+\.)\s*(\d{4})/);if(!m)return Infinity;const mi=TH_M.indexOf(m[2]);if(mi<0)return Infinity;
  let y=+m[3];if(y>2400)y-=543;const t=String(s).match(/(\d{1,2}):(\d{2})/);return new Date(y,mi,+m[1],t?+t[1]:0,t?+t[2]:0).getTime()}
const isoToday=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};

function renderPeople(){
  const el=document.getElementById('people');
  let list=state.people.map((p,i)=>({p,i,n:p.classes.length,h:hrs(p.classes)}));
  const total=list.length;
  list=list.filter(x=>hasQ(ui.pq,x.p.name,x.p.program,...x.p.classes.map(c=>c.code)));
  const cmp={order:(a,b)=>a.i-b.i,az:(a,b)=>byStr(a.p.name,b.p.name),za:(a,b)=>byStr(b.p.name,a.p.name),hours:(a,b)=>b.h-a.h||a.i-b.i}[ui.psort]||((a,b)=>a.i-b.i);
  list.sort(cmp);
  el.innerHTML=`<div class="side-h"><h2>ตารางของใคร</h2><span class="count">${list.length===total?total+' คน':list.length+' จาก '+total+' คน'}</span></div>
    <input type="search" class="q" id="q-people" data-ui="pq" value="${esc(ui.pq)}" placeholder="ค้นหาชื่อ หรือรหัสวิชา" aria-label="ค้นหาคน">
    <select class="q" id="so-people" data-ui="psort" aria-label="เรียงลำดับ">${opt('psort','order','เรียงตามลำดับที่เพิ่ม')}${opt('psort','az','ชื่อ ก → ฮ')}${opt('psort','za','ชื่อ ฮ → ก')}${opt('psort','hours','ชั่วโมงเรียนมาก → น้อย')}</select>
    <div class="plist">${list.map(x=>`<button class="pitem" data-id="${x.p.id}" aria-pressed="${x.p.id===cur().id}"><span class="pn">${esc(x.p.name||'(ไม่มีชื่อ)')}</span><span class="ps">${x.n} วิชา · ${fmtH(x.h)} ชม./สัปดาห์</span></button>`).join('')}</div>
    ${list.length?'':'<div class="note">ไม่พบชื่อหรือรหัสวิชาที่ค้นหา</div>'}
    <button class="btn primary" id="uploadPerson">อัปโหลดรูปตาราง (AI กรอกให้)</button>
    <button class="btn" id="addPerson">+ เพิ่มคนแบบกรอกเอง</button>`;
  bindUI(el);
  el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.currentId=b.dataset.id;commit()});
  el.querySelector('#uploadPerson').onclick=openUpload;
  el.querySelector('#addPerson').onclick=()=>editPerson(person('',{advisor:''}),true);
}
function hourOpts(sel,from,to){let s='';for(let h=from;h<=to;h++)s+=`<option value="${h}"${h===sel?' selected':''}>${pad(h)}:00</option>`;return s}
const classMatch=(p,c)=>hasQ(ui.cq,c.code,c.room,c.group,c.day,courseName(p,c.code))&&inWeek(c.dates,ui.cdate);
function renderSheet(){
  const p=cur(),el=document.getElementById('sheet');
  const I=(label,v)=>`<dt>${label}</dt><dd${v?'':' class="empty"'}>${v?esc(v):'—'}</dd>`;
  const open=ui.profOpen??(innerWidth>=700);
  const shown=p.classes.filter(c=>classMatch(p,c)).length,filtering=!!(String(ui.cq).trim()||ui.cdate);
  el.innerHTML=`
    <div class="sheet-head"><div>

/* shared timetable: items = [{day,start,end,html,attrs,cls,tag,color,hide}] */
function gridHTML(g,{startHour,endHour,days,items}){
  const hours=endHour-startHour,slots=hours*2,base=startHour*60;
  g.style.gridTemplateColumns=`var(--daycol) repeat(${slots},minmax(var(--slot),1fr))`;
  let h=`<div class="gh" style="grid-row:1;grid-column:1">Day/Time</div>`;
  for(let i=0;i<hours;i++)h+=`<div class="gh" style="grid-row:1;grid-column:${2+i*2}/span 2">${pad(startHour+i)}:00-${pad(startHour+i+1)}:00</div>`;
  let row=2;
  days.forEach(day=>{
    const list=items.filter(c=>c.day===day).sort((a,b)=>toMin(a.start)-toMin(b.start));
    const lanes=[];const placed=[];
    list.forEach(c=>{const s=toMin(c.start),e=toMin(c.end);let l=lanes.findIndex(end=>end<=s);if(l<0){l=lanes.length;lanes.push(e)}else lanes[l]=e;placed.push([c,l])});
    const n=Math.max(1,lanes.length);
    h+=`<div class="gd${WEEKEND.includes(day)?' weekend':''}" style="grid-row:${row}/span ${n};grid-column:1">${esc(day)}</div>`;
    for(let l=0;l<n;l++)for(let i=0;i<hours;i++)
      h+=`<button class="ge" style="grid-row:${row+l};grid-column:${2+i*2}/span 2" data-day="${esc(day)}" data-h="${startHour+i}" aria-label="เพิ่ม ${esc(day)} ${pad(startHour+i)}:00"></button>`;
    placed.forEach(([c,l])=>{
      let s=Math.round((toMin(c.start)-base)/30),e=Math.round((toMin(c.end)-base)/30);
      s=Math.max(0,s);e=Math.min(slots,e);if(e<=s)return;
      const span=e-s,tag=c.tag||'button';
      h+=`<${tag} class="gc${span>=8?' big':''} ${c.cls||''}${c.hide?' dim':''}" ${c.attrs||''} style="grid-row:${row+l};grid-column:${2+s}/span ${span}">${c.html}</${tag}>`;
    });
    row+=n;
  });
  g.innerHTML=h;
}
function agendaHTML(g,{days,items,addLabel}){
  g.innerHTML=days.map(day=>{
    const list=items.filter(i=>i.day===day&&!i.hide).sort((a,b)=>toMin(a.start)-toMin(b.start));
    const n=list.filter(i=>!String(i.cls||'').includes('busy')).length;
    return `<section class="aday"><h3 class="aday-h${WEEKEND.includes(day)?' weekend':''}">${esc(day)}<span>${n?n+' รายการ':''}</span></h3>
      ${list.map(i=>{const tag=i.tag||'button';return `<${tag} class="ai ${i.cls||''}" ${i.attrs||''} style="--sw:var(--b-${esc(i.color||'slate')})"><span class="at">${esc(i.start)}<br>${esc(i.end)}</span><span class="ab">${i.html}</span></${tag}>`}).join('')||'<div class="note aempty">ว่าง</div>'}
      <button class="addday" data-day="${esc(day)}">+ ${addLabel}</button></section>`}).join('');
}
function drawTimetable(wrap,mode,cfg){
  if(mode==='list'){wrap.innerHTML='<div class="agenda"></div>';agendaHTML(wrap.firstChild,cfg)}
  else{wrap.innerHTML='<div class="scroll"><div class="grid"></div></div>';gridHTML(wrap.querySelector('.grid'),cfg)}

/* ---------- modals ---------- */
function modal(html,bind){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="ov"><div class="card modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov=root.firstChild,close=()=>{root.innerHTML='';document.removeEventListener('keydown',esc_);setTimeout(tryFlush,0)};
  const esc_=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc_);
  ov.onclick=e=>{if(e.target===ov)close()};
  bind(ov,close);
  const f=ov.querySelector('input,select,textarea');f&&f.focus();
}
/* fields: [{k,label,type:'text'|'number'|'select'|'textarea',value,options:[[v,l]],full,placeholder,required}] */
function openForm({title,fields,onSave,onDelete,saveLabel='บันทึก'}){
  modal(`<h2>${esc(title)}</h2><form class="form" id="gf">${fields.map(f=>{
      const id='g-'+f.k,lab=`${esc(f.label)}`,cls=f.full?' class="full"':'';
      if(f.type==='select')return `<label${cls}>${lab}<select id="${id}">${f.options.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(f.value??'')?' selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
      if(f.type==='textarea')return `<label${cls}>${lab}<textarea id="${id}" rows="3">${esc(f.value)}</textarea></label>`;
      return `<label${cls}>${lab}<input id="${id}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(f.value)}" placeholder="${esc(f.placeholder||'')}"${f.required?' required':''}></label>`}).join('')}
    <div class="actions full">${onDelete?'<button type="button" class="btn danger" id="g-del">ลบ</button><span class="spacer"></span>':''}
      <button type="button" class="btn" id="g-cancel">ยกเลิก</button><button class="btn primary">${esc(saveLabel)}</button></div></form>`,(ov,close)=>{
    ov.querySelector('#g-cancel').onclick=close;
    const del=ov.querySelector('#g-del');del&&armDelete(del,()=>{close();onDelete()});
    ov.querySelector('#gf').onsubmit=e=>{e.preventDefault();const v={};
      fields.forEach(f=>{let x=ov.querySelector('#g-'+f.k).value;if(f.type!=='textarea')x=x.trim();if(f.type==='number')x=x===''?'':(+x||0);v[f.k]=x});
      close();onSave(v)};
  });
}

function openDays(p,items){

    ov.querySelector('.modal').innerHTML=`<h2>จัดการวัน</h2>
      <div class="daylist">${p.days.map((d,i)=>{const n=items.filter(c=>c.day===d).length;return `<div class="dayrow"><span>${esc(d)} <span class="note">${n?n+' รายการ':''}</span></span>

        <label>ชื่อวัน (ถ้าเลือก “อื่น ๆ”)<input id="d-custom" placeholder="เช่น สอบเก็บคะแนน"></label>
      </div>
      <div class="actions"><button class="btn primary" id="d-add">+ เพิ่มวัน</button><button class="btn" id="d-close">เสร็จ</button></div>`;
    const re=()=>{commit();draw(ov,close)};
    ov.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[p.days[i-1],p.days[i]]=[p.days[i],p.days[i-1]];re()});
    ov.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[p.days[i+1],p.days[i]]=[p.days[i],p.days[i+1]];re()});

    ov.querySelector('#d-add').onclick=()=>{const s=ov.querySelector('#d-pick').value;let d=s==='__custom'?ov.querySelector('#d-custom').value.trim():s;
      if(!d||p.days.includes(d))return;
      if(s!=='__custom'){const ord=x=>{const k=ALL_DAYS.indexOf(x);return k<0?99:k};const idx=p.days.findIndex(x=>ord(x)>ord(d));idx<0?p.days.push(d):p.days.splice(idx,0,d)}else p.days.push(d);
      re()};
    ov.querySelector('#d-close').onclick=close;
  };
  modal('',draw);
}

function slotClashes(slot){
  const out=[],t=tch(slot.teacherId);
  if(t&&t.personId){const p=state.people.find(x=>x.id===t.personId);
    if(p)p.classes.filter(c=>overlap(c,slot)).forEach(c=>out.push(`${t.name} ติดเรียน ${c.code}${c.group?' กลุ่ม '+c.group:''} ${c.day} ${c.start}-${c.end}${c.dates?' (ช่วง '+c.dates+')':''}`))}
  TT().slots.filter(s=>s.id!==slot.id&&overlap(s,slot)).forEach(s=>{
    if(t&&s.teacherId===slot.teacherId)out.push(`${t.name} สอน ${subLabel(sub(s.subjectId))} ${s.start}-${s.end} ซ้อนกัน`);
    else if((s.room||'').trim()===(slot.room||'').trim())out.push(`${slot.room?'ห้อง '+slot.room:'เด็กกลุ่มเดียวกัน'} มี ${subLabel(sub(s.subjectId))} เวลาเดียวกัน`);
  });

        <button type="button" class="btn" id="s-cancel">ยกเลิก</button><button class="btn primary">บันทึก</button></div>
    </form>`,(ov,close)=>{
    const q=id=>ov.querySelector('#s-'+id);

      if(c.length){box.className='mclash full';box.innerHTML='<b>⚠ ชน:</b> '+c.map(esc).join('<br>')}

      return true};
    q('sub').onchange=()=>{const x=sub(q('sub').value);if(x&&x.teacherId)q('tch').value=x.teacherId;check()};
    ['tch','room','day','start','end'].forEach(k=>q(k).oninput=check);q('day').onchange=check;q('tch').onchange=check;
    check();
    q('cancel').onclick=close;
    const del=q('del');del&&armDelete(del,()=>{T.slots=T.slots.filter(x=>x.id!==s.id);close();commit();toast('ลบคาบสอนแล้ว')});
    ov.querySelector('#sf').onsubmit=e=>{e.preventDefault();if(!check())return;
      const o=read();delete o.id;
      if(isNew)T.slots.push({id:uid(),...o});else Object.assign(s,o);

      close();commit();toast(c.length?'บันทึกแล้ว แต่มีเวลาชน':'บันทึกแล้ว ไม่ชน')};
  });
}

let apiCfg=null;
const normT=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})$/);return m?pad(+m[1])+':'+m[2]:''};
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('เปิดรูป '+file.name+' ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'));i.src=url});
    const k=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',0.85);return {data:d.split(',')[1],mediaType:'image/jpeg',preview:d,name:file.name};
  }finally{URL.revokeObjectURL(url)}
}
function personFromAI(name,d){
  const classes=(d.classes||[]).map(c=>({...c,start:normT(c.start),end:normT(c.end)}))
    .filter(c=>ALL_DAYS.includes(c.day)&&c.start&&c.end&&toMin(c.end)>toMin(c.start))
    .map(c=>({id:uid(),day:c.day,start:c.start,end:c.end,code:String(c.code||'').trim(),group:String(c.group||''),room:c.room||'',dates:c.dates||'',color:COLORS.some(([k])=>k===c.color)?c.color:'blue'}));
  let days=ALL_DAYS.filter(x=>(d.days||[]).includes(x)||classes.some(c=>c.day===x));
  days=ALL_DAYS.filter((x,i)=>i<5||days.includes(x));
  const s=d.student||{};
  return person(name,{
    status:s.status||PROFILE.status,faculty:s.faculty||PROFILE.faculty,program:s.program||PROFILE.program,advisor:s.advisor||'',year:s.year||PROFILE.year,term:s.term||PROFILE.term,
    startHour:Math.min(9,...classes.map(c=>Math.floor(toMin(c.start)/60))),endHour:Math.max(17,...classes.map(c=>Math.ceil(toMin(c.end)/60))),
    days,classes,exams:(d.exams||[]).map(e=>({id:uid(),code:e.code||'',nameEn:e.nameEn||'',nameTh:e.nameTh||'',group:String(e.group||''),mid:e.mid||'-',final:e.final||'-'}))});
}

    }
    async function addFiles(files){
      const imgs=files.filter(f=>f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name));
      if(!imgs.length)return;
      st.error='';
      for(const f of imgs){if(st.images.length>=4){st.error='ใส่ได้สูงสุด 4 รูป';break}

      draw(ov,close);
    }
    ov.onpaste=e=>{if(st.step!=='pick')return;const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs)}};

        let j=null;try{j=await r.json()}catch(e){}

      }catch(e){st.step='pick';st.error=e.name==='AbortError'?'รอนานเกินไป ลองใหม่อีกครั้ง หรืออัปโหลดทีละรูป':(e.message==='Failed to fetch'?'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง':e.message)}
      finally{clearTimeout(to);clearInterval(timer)}
      if(document.body.contains(ov))draw(ov,close);
    }
  };
  modal('',draw);
}

/* ---------- cloud sync (Supabase realtime) ---------- */
const TABLE='schedule_docs',SUPA_CDN='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
let cloud=null,pushTimer=null;const remoteQ=[];
function setSync(st,msg){const el=document.getElementById('sync');el.dataset.s=st;
  el.textContent={local:'บันทึกในเครื่องนี้',connecting:'กำลังเชื่อมต่อฐานข้อมูล…',live:'ออนไลน์ · อัปเดตเรียลไทม์',error:'เชื่อมต่อไม่ได้: '+(msg||'')}[st]||st;
  el.title=st==='error'?'แก้ไขยังบันทึกในเครื่องนี้ จะส่งขึ้นฐานข้อมูลอีกครั้งเมื่อแก้ไขครั้งถัดไป':''}
function rowsOf(){const m=new Map();state.people.forEach((p,i)=>m.set('p_'+p.id,{kind:'person',sort:i,data:p}));m.set('teach',{kind:'teach',sort:0,data:state.teach});return m}
const sig=(sort,data)=>JSON.stringify([sort,data]);
function schedulePush(ms=500){if(!cloud)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,ms)}
async function push(){
  if(!cloud)return;clearTimeout(pushTimer);pushTimer=null;
  const rows=rowsOf(),up=[],del=[],now=new Date().toISOString();
  rows.forEach((r,id)=>{const j=sig(r.sort,r.data);if(cloud.synced.get(id)!==j){up.push({id,kind:r.kind,sort:r.sort,data:r.data,updated_at:now});cloud.synced.set(id,j)}});
  [...cloud.synced.keys()].forEach(id=>{if(!rows.has(id)){del.push(id);cloud.synced.delete(id)}});
  if(!up.length&&!del.length)return;
  try{
    if(up.length){const {error}=await cloud.sb.from(TABLE).upsert(up);if(error)throw error}
    if(del.length){const {error}=await cloud.sb.from(TABLE).delete().in('id',del);if(error)throw error}
    if(cloud.live)setSync('live');
  }catch(e){up.forEach(r=>cloud.synced.delete(r.id));del.forEach(id=>cloud.synced.set(id,'__retry'));setSync('error',e.message||'บันทึกไม่สำเร็จ')}
}
function fixState(){
  if(!state.people.length)state.people.push(person('คนใหม่',{advisor:''}));
  if(!state.people.some(p=>p.id===state.currentId))state.currentId=state.people[0].id;
  if(!state.teach)state.teach=seedTeach();
}
function applyRows(rows){
  rows.forEach(r=>{cloud.synced.set(r.id,sig(r.sort,r.data));cloud.sort.set(r.id,r.sort);
    if(r.kind==='teach')state.teach=r.data;
    else{const i=state.people.findIndex(p=>p.id===r.data.id);if(i<0)state.people.push(r.data);else state.people[i]=r.data}});
  state.people.sort((a,b)=>(cloud.sort.get('p_'+a.id)??1e9)-(cloud.sort.get('p_'+b.id)??1e9));
}
function busy(){const a=document.activeElement;return !!document.getElementById('modalRoot').firstChild||!!(a&&a.matches('input,textarea,select')&&!a.classList.contains('q')&&a.closest('#vStudy,#vTeach'))}
function onRemote(pl){remoteQ.push(pl);tryFlush()}
function tryFlush(){
  if(!cloud||!remoteQ.length||busy())return;
  if(pushTimer)push();
  const q=remoteQ.splice(0),rows=[];let changed=false;
  q.forEach(pl=>{
    if(pl.eventType==='DELETE'){const id=pl.old&&pl.old.id;if(!id||!cloud.synced.has(id))return;cloud.synced.delete(id);cloud.sort.delete(id);
      if(id.startsWith('p_')){state.people=state.people.filter(p=>p.id!==id.slice(2));changed=true}}
    else{const r=pl.new;if(!r||cloud.synced.get(r.id)===sig(r.sort,r.data))return;rows.push(r)}});
  if(rows.length){applyRows(rows);changed=true}
  if(changed){fixState();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()}
}
document.addEventListener('focusout',()=>setTimeout(tryFlush,0));
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('โหลดไลบรารีไม่ได้'));document.head.appendChild(s)})}
async function initCloud(){
  let cfg;
  try{const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)return;cfg=await r.json();apiCfg={ai:cfg.ai!==false}}catch(e){return}
  if(!cfg||!cfg.url||!cfg.anonKey)return;
  setSync('connecting');
  try{
    if(!window.supabase)await loadScript(SUPA_CDN);
    const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
    const {data,error}=await sb.from(TABLE).select('id,kind,sort,data');if(error)throw error;
    cloud={sb,synced:new Map(),sort:new Map(),live:false};
    if(data.length){
      const keep=state.currentId;state.people=[];state.teach=null;applyRows(data);state.currentId=keep;fixState();
      try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render();
    }else{await push();toast('สร้างข้อมูลเริ่มต้นในฐานข้อมูลแล้ว')}
    sb.channel('schedule-docs').on('postgres_changes',{event:'*',schema:'public',table:TABLE},onRemote)
      .subscribe(st=>{if(st==='SUBSCRIBED'){cloud.live=true;setSync('live')}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){cloud.live=false;setSync('error','การอัปเดตเรียลไทม์หลุด รีเฟรชหน้าเพื่อเชื่อมต่อใหม่')}});
  }catch(e){cloud=null;setSync('error',e.message||'ไม่ทราบสาเหตุ')}
}

/* ---------- data tools ---------- */
const box=document.getElementById('dataBox');
async function copyOut(obj,label){box.value=JSON.stringify(obj);try{await navigator.clipboard.writeText(box.value);toast('คัดลอก'+label+'แล้ว')}catch(e){box.focus();box.select();toast('เลือกข้อความไว้แล้ว กดคัดลอกเองได้เลย')}}
document.getElementById('bExpOne').onclick=()=>copyOut(cur(),'ข้อมูลคนนี้');
document.getElementById('bExpAll').onclick=()=>copyOut({people:state.people,teach:state.teach},'ข้อมูลทุกคนและตารางสอน');
document.getElementById('bImport').onclick=()=>{
  let d;try{d=JSON.parse(box.value)}catch(e){toast('ข้อความไม่ใช่ข้อมูลตารางเรียน ลองคัดลอกใหม่อีกครั้ง');return}
  const arr=Array.isArray(d)?d:d&&Array.isArray(d.people)?d.people:[d];
  const ok=arr.filter(x=>x&&typeof x==='object'&&Array.isArray(x.classes));
  const hasTeach=d&&d.teach&&Array.isArray(d.teach.slots);
  if(!ok.length&&!hasTeach){toast('ไม่พบตารางเรียนในข้อความที่วาง');return}
  const idMap={};
  ok.forEach(x=>{const p=person(x.name||'นำเข้า',x);p.id=uid();idMap[x.id]=p.id;p.days=Array.isArray(x.days)?x.days:p.days;p.exams=Array.isArray(x.exams)?x.exams:[];
    p.classes.forEach(c=>c.id=c.id||uid());p.exams.forEach(e=>e.id=e.id||uid());state.people.push(p);state.currentId=p.id});
  if(hasTeach){state.teach=d.teach;state.teach.teachers.forEach(t=>{if(t.personId)t.personId=idMap[t.personId]||(state.people.some(p=>p.id===t.personId)?t.personId:'')})}
  box.value='';commit();toast('นำเข้า '+ok.length+' ตาราง'+(hasTeach?' และตารางสอน':'')+'แล้ว');
};
document.getElementById('bDup').onclick=()=>{const p=JSON.parse(JSON.stringify(cur()));p.id=uid();p.name+=' (สำเนา)';state.people.push(p);state.currentId=p.id;commit();toast('ทำสำเนาแล้ว')};
const bDel=document.getElementById('bDel');
bDel.onclick=()=>{
  if(!bDel.classList.contains('armed')){bDel.classList.add('armed');bDel.textContent='กดอีกครั้งเพื่อลบ “'+cur().name+'”';setTimeout(()=>{bDel.classList.remove('armed');bDel.textContent='ลบตารางของคนนี้'},3500);return}
  const name=cur().name;state.people=state.people.filter(p=>p.id!==cur().id);
  if(!state.people.length)state.people.push(person('คนใหม่',{advisor:''}));
  state.currentId=state.people[0].id;bDel.classList.remove('armed');bDel.textContent='ลบตารางของคนนี้';commit();toast('ลบตารางของ '+name+' แล้ว');
};

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
view=location.hash.slice(1)==='teach'?'teach':'study';
render();
initCloud();
</script>
